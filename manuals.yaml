- id: manual-dircode-slim-installation
  category: installation
  title: Установка и смена направления ручки — Dircode Slim
  keywords:
  - установка
  - монтаж
  - перевернуть ручку
  - направление ручки
  - slim
  - слим
  applicable_models:
  - Dircode Slim
  steps: '**Смена направления ручки:**

    1. Поверните ручку на передней панели.

    2. Ослабьте внутренний шестигранный винт ручки против часовой стрелки.

    3. Снимите ручку.

    4. После регулировки направления вставьте ручку в гнездо.

    5. Снова зафиксируйте шестигранный винт.


    **Установка квадрата:**

    Если ручка указывает влево — поверните треугольную точку влево. Если вправо —
    вправо. Вставьте металлический фиксатор квадрата в отверстие и согните его передний
    конец для фиксации.'
