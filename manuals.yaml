- id: manual-bio20-installation
  category: installation
  title: Монтаж и проверка перед установкой — Dircode Bio 2.0
  keywords:
  - монтаж
  - установка
  - подключение
  - проверка
  - bio 2.0
  applicable_models:
  - Dircode Bio 2.0
  steps: 'Рекомендуемая высота установки: 1500 мм от пола до низа внешней панели.


    **Обязательная проверка перед монтажом:**

    1. Соедините внешнюю панель, контроллер и замок на столе.

    2. Подайте питание на контроллер (12-24В).

    3. Закройте замок (герконом или механически).

    4. На внешней панели введите базовый код 123456#.

    5. Замок должен открыться.


    Внешнюю панель можно закрепить на винты (сверление двери) или на скотч 3М (если
    поверхность позволяет).'
- id: manual-vision-wiring
  category: installation
  title: Требования к кабелю и подключению — Dircode Vision
  keywords:
  - кабель
  - провод
  - подключение
  - витая пара
  - сечение
  - vision
  - домофон
  applicable_models:
  - Dircode Vision
  steps: 'Для подключения вызывных панелей используется 4-жильный кабель:

    - До 30 метров: сечение 4 x 0.65 мм

    - До 50 метров: сечение 4 x 1.0 мм

    - Более 50 метров: рекомендуется экранированный провод с заземлением экрана.


    **Важно:** Использование витой пары (Cat5/6) не рекомендуется. Если используете,
    то максимальная длина — 20м (без экрана) или 40м (с экраном), при этом одна витая
    пара используется как один кабель.


    Кабель должен проходить на расстоянии более 30 см от сети переменного тока 220В
    и вдали от устройств с сильным излучением.'
