- id: manual-hyundai-sla102-app-setup
  category: app_setup
  title: Подключение к приложению Smart Life (Tuya) по Wi-Fi — Hyundai HY-SLA102
  keywords:
  - wi-fi
  - вай фай
  - приложение
  - smart life
  - tuya
  - sla102
  - '102'
  applicable_models:
  - Hyundai HY-SLA102
  steps: 'Замок работает с приложением **Smart Life (или Tuya Smart)**.


    1. Подключите телефон к Wi-Fi сети 2.4 ГГц.

    2. На замке войдите в главное меню: [*] → [#] → [Пароль администратора] → [#].

    3. Перейдите в раздел: [3. Настройки] → [3. Функции] → [1. Подключение к сети].

    4. Откройте приложение Smart Life, нажмите [+] в правом верхнем углу.

    5. Дождитесь появления замка в списке и нажмите на него.

    6. Введите пароль от вашего Wi-Fi и завершите сопряжение.'
