- id: manual-037
  category: battery
  title: Питание, замена батареек и аварийное открытие — Philips DDL615-5HBS
  keywords:
  - ddl615 батарейки
  - ddl615 замена батареек
  - ddl615 какие батарейки
  - philips 615 батарейки
  - ddl615 низкий заряд
  - ddl615 красный индикатор
  - ddl615 мигает красным
  - ddl615 аварийное питание
  - ddl615 power bank
  - ddl615 type-c
  - ddl615 механический ключ
  - ddl615 разрядились батарейки
  - ddl615 аккумулятор
  - philips 615 не открывается разряд
  - ddl615 aaa
  - low battery мигает красным
  - low battery индикатор
  - philips low battery
  - ddl615 low battery
  - батарея разряжена мигает
  - индикатор разряда батареи
  applicable_models:
  - Philips EasyKey DDL615-5HBS
  steps: 'А) Элементы питания:

    Замок работает от 4 щелочных батареек типа AAA.

    В отсек можно установить до 8 батареек для продления срока службы.


    Б) Индикация разряда:

    При активации замок автоматически проверяет напряжение батарей.

    Если напряжение низкое — индикатор загорается красным цветом и мигает.

    При появлении этого сигнала замените батарейки в ближайшее время.


    В) Аварийное питание (если батарейки полностью разрядились):

    1. Подключите Power Bank (5V) к порту Type-C на нижней панели наружного блока
    замка.

    2. Дождитесь, пока замок получит достаточно энергии.

    3. Откройте дверь обычным способом (PIN-код, отпечаток, RFID-брелок).

    Примечание: подключение внешнего питания также автоматически перезагружает систему
    при программных сбоях.


    Г) Механический ключ (экстренное открытие):

    1. Найдите отверстие для ключа в нижней части наружного блока замка.

    2. Вставьте механический ключ и поверните для открытия.

    Используйте только в экстренных ситуациях: разряд батарей, забытый PIN-код, сбой
    системы.

    '
  warnings:
  - Используйте ТОЛЬКО щелочные (Alkaline) батарейки типа AAA. НЕ используйте аккумуляторные
    батарейки — их напряжение (1.2В) ниже номинального (1.5В).
  - Не смешивайте старые и новые батарейки.
  - Храните механический ключ в надёжном месте вне квартиры — он понадобится при полном
    разряде батарей.
  model_key: philips_ddl615
  brand: Philips
  procedure_type: power_management
  updated_at: '2026-05-05'
- id: manual-038
  category: troubleshooting
  title: Системная блокировка (защита от подбора кода) — Philips DDL615-5HBS
  keywords:
  - ddl615 блокировка
  - ddl615 заблокировался
  - ddl615 неверный пароль
  - philips 615 заблокирован
  - ddl615 5 попыток
  - ddl615 3 минуты блокировка
  - ddl615 защита от подбора
  - ddl615 неверный отпечаток
  - ddl615 неверный брелок
  - ddl615 замок не открывается
  - philips заблокировался от неправильного кода
  - ddl615 много неудачных попыток
  applicable_models:
  - Philips EasyKey DDL615-5HBS
  steps: 'Системная блокировка (защита от подбора) на Philips DDL615-5HBS:


    Условие срабатывания:

    Если в течение 5 минут 5 раз подряд ввести неверный PIN-код, приложить

    незарегистрированный отпечаток пальца или неизвестный RFID-брелок —

    замок автоматически заблокируется на 3 минуты.


    Что делать при блокировке:

    1. Подождите 3 минуты — блокировка снимется автоматически.

    2. После снятия блокировки используйте правильный метод доступа.


    Альтернативные способы открытия во время блокировки:

    - Механический ключ (отверстие в нижней части наружного блока).

    - Открытие изнутри (ручка на внутренней панели).

    '
  warnings:
  - Блокировка — это защитная функция от подбора кода. НЕ пытайтесь продолжать ввод
    — это не поможет.
  - Если вы забыли все коды доступа и не можете войти — используйте механический ключ.
  model_key: philips_ddl615
  brand: Philips
  procedure_type: general_info
  updated_at: '2026-05-05'
- id: manual-039
  category: troubleshooting
  title: Сигнализация взлома (Tamper alert) — Philips DDL615-5HBS
  keywords:
  - ddl615 тревога
  - ddl615 сигнализация
  - ddl615 tamper alert
  - ddl615 пищит
  - ddl615 звуковой сигнал непрерывный
  - philips 615 сигнал тревоги
  - ddl615 попытка взлома
  - ddl615 наружный блок поддет
  - ddl615 не прилегает
  - philips easykey тревога
  - ddl615 пищит постоянно
  - ddl615 как отключить сигнал
  applicable_models:
  - Philips EasyKey DDL615-5HBS
  steps: 'Сигнализация взлома (Tamper alert) на Philips DDL615-5HBS:


    Когда срабатывает:

    Тревога активируется, если наружный блок замка был поддет и неплотно

    прилегает к двери. Замок определяет смещение и включает сигнализацию.


    Как проявляется:

    Замок издаёт непрерывный повторяющийся звуковой сигнал (пищит).


    Как отключить:

    Сигнализация отключается автоматически после успешного открытия двери

    любым зарегистрированным способом — как снаружи, так и изнутри.


    Что делать:

    1. Откройте дверь зарегистрированным методом (PIN, отпечаток, RFID или ключ).

    2. Осмотрите наружный блок на предмет повреждений или смещения.

    3. Убедитесь, что наружный блок плотно прилегает к двери.

    4. Если блок повреждён — обратитесь в сервисный центр.

    '
  warnings:
  - Не игнорируйте срабатывание тревоги — проверьте, не было ли попытки взлома.
  - Если тревога срабатывает без видимых причин — возможно, ослабли крепления наружного
    блока. Подтяните их.
  model_key: philips_ddl615
  brand: Philips
  procedure_type: general_info
  updated_at: '2026-05-05'
- id: manual-040
  category: setup
  title: Режим внутренней блокировки (Indoor lockout mode) — Philips DDL615-5HBS
  keywords:
  - ddl615 внутренняя блокировка
  - ddl615 indoor lockout
  - ddl615 заблокировать снаружи
  - philips 615 ночной режим
  - ddl615 закрыть изнутри
  - ddl615 не открывается снаружи
  - ddl615 мастер доступ обход
  - philips easykey внутренняя блокировка
  - ddl615 запретить вход
  - ddl615 ночная блокировка
  - ddl615 lockout
  applicable_models:
  - Philips EasyKey DDL615-5HBS
  steps: 'Режим внутренней блокировки (Indoor lockout mode) на Philips DDL615-5HBS:


    Что это:

    Режим, при котором обычные пользователи НЕ могут открыть дверь снаружи.

    Удобно для ночного времени или когда вы находитесь дома и не хотите,

    чтобы кто-то мог войти.


    Как включить:

    Режим включается через приложение Home Access.


    Как обойти блокировку (только при необходимости):

    Для открытия двери снаружи при включённом режиме необходимо использовать:

    - Мастер-PIN (мастер-код)

    - Мастер-отпечаток пальца

    - Механический ключ


    Важно: использование мастер-метода автоматически отключает режим внутренней блокировки.

    '
  warnings:
  - Обычные пользовательские методы доступа (обычный PIN, обычный отпечаток, RFID)
    НЕ работают при включённом режиме.
  - Мастер-доступ или механический ключ автоматически снимает эту блокировку.
  - Включайте этот режим только находясь внутри помещения — иначе вы не сможете войти
    обычным способом.
  model_key: philips_ddl615
  brand: Philips
  procedure_type: configuration
  updated_at: '2026-05-05'
- id: manual-041
  category: maintenance
  title: Уход за замком и ёмкость памяти — Philips DDL615-5HBS
  keywords:
  - ddl615 уход
  - ddl615 чистка
  - ddl615 протереть
  - philips 615 обслуживание
  - ddl615 сколько отпечатков
  - ddl615 сколько пользователей
  - ddl615 ёмкость
  - ddl615 максимум пользователей
  - ddl615 100 отпечатков
  - ddl615 20 пин кодов
  - ddl615 rfid брелок
  - philips 615 характеристики
  - ddl615 спецификации
  - ddl615 сколько карт
  applicable_models:
  - Philips EasyKey DDL615-5HBS
  steps: "А) Ёмкость памяти Philips DDL615-5HBS:\n- 1 мастер PIN-код.\n- 100 отпечатков\
    \ пальцев (включая 1 мастер-отпечаток).\n- 20 пользовательских PIN-кодов.\n- 100\
    \ RFID-брелоков (Key tags).\n\nБ) Уход за устройством:\n1. Для очистки поверхности\
    \ замка от отпечатков пальцев и грязи\n   используйте мягкую влажную ткань.\n\
    2. Протирайте панель по мере загрязнения.\n\nВ) Чего делать НЕЛЬЗЯ:\n- Запрещается\
    \ использовать спирт, ацетон и другие агрессивные вещества.\n- Не применяйте абразивные\
    \ материалы — они повредят защитное покрытие.\n"
  warnings:
