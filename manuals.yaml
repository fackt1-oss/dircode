- id: manual-hyundai-sla102-first-admin
  category: admin_setup
  title: Первый вход и добавление администратора — Hyundai HY-SLA102
  keywords:
  - первый запуск
  - добавить администратора
  - пароль админа
  - sla102
  - '102'
  applicable_models:
  - Hyundai HY-SLA102
  steps: 'По умолчанию замок открывается любым лицом, отпечатком или паролем. Для
    настройки нужно добавить администратора:


    1. Нажмите [*], затем [#].

    2. Замок скажет: «Добавьте пользователя-администратора, введите пароль из 6-8
    цифр».

    3. Введите придуманный пароль и нажмите [#].

    4. Повторите пароль и нажмите [#].


    Вы услышите «Добавление успешно», и система перейдет в главное меню.'
- id: manual-hyundai-sla102-add-user
  category: user_management
  title: Добавление лица, вены ладони, отпечатка, кода или карты — Hyundai HY-SLA102
  keywords:
  - добавить лицо
  - добавить вену ладони
  - добавить код
  - добавить отпечаток
  - sla102
  - '102'
  applicable_models:
  - Hyundai HY-SLA102
  steps: 'Войдите в главное меню, нажав [*] → [#] → [Пароль администратора] → [#].

    Далее выберите пункт добавления пользователя и следуйте инструкциям:


    - **Лицо:** Встаньте напротив замка на расстоянии 30-80 см от камеры.

    - **Вена ладони:** Расположите ладонь напротив камеры на расстоянии 5-30 см (немного
    выше уровня объектива).

    - **Отпечаток:** Прикладывайте палец к сканеру несколько раз.

    - **Пароль:** Введите код (6-8 цифр) → [#] → Повторите код → [#].

    - **RF-карта:** Поднесите карту к зоне считывания (в районе цифры 5).'
- id: manual-hyundai-sla102-delete-user
  category: user_management
  title: Удаление пользователей — Hyundai HY-SLA102
  keywords:
  - удалить лицо
  - удалить код
  - удалить отпечаток
  - sla102
  - '102'
  applicable_models:
  - Hyundai HY-SLA102
  steps: 'Войдите в главное меню ([*] → [#] → [Пароль администратора] → [#]) и выберите
    меню удаления пользователей.


    **Способ 1 (по идентификатору):**

    Просто предъявите то, что хотите удалить (покажите лицо, приложите палец, поднесите
    карту или введите пароль). Замок скажет «Удаление успешно».


    **Способ 2 (по номеру ID):**

    Введите 3-значный порядковый номер пользователя (например, 001) и подтвердите.'
- id: manual-hyundai-sla102-reset
  category: reset
  title: Сброс до заводских настроек (RESET) — Hyundai HY-SLA102
  keywords:
  - сброс настроек
