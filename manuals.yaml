  steps: 'Замок работает с приложением **Sciener** по Bluetooth.


    1. Скачайте приложение Sciener (iOS / Android) и зарегистрируйтесь.

    2. Включите Bluetooth на смартфоне и находитесь рядом с замком.

    3. В приложении нажмите «+» (Добавить замок) → «Дверной замок».

    4. Коснитесь клавиатуры замка для её активации.

    5. Нажмите «Далее» в приложении.

    6. Появится имя замка с «синим плюсиком». Нажмите на него.

    7. Введите имя для замка.


    *Для удаленного управления по Wi-Fi требуется приобрести отдельный Wi-Fi хаб.*'
