  title: Сброс до заводских настроек (Factory Reset) — Philips DDL615-5HBS
  keywords:
  - ddl615 сброс
  - ddl615 reset
  - ddl615 заводские настройки
  - philips 615 сброс
  - ddl615 кнопка res
  - ddl615 забыл мастер код
  - ddl615 сбросить замок
  - philips сброс настроек
  - ddl615 восстановить заводские
  - ddl615 удалить все данные
  - philips easykey factory reset
  - ddl615 батарейный отсек кнопка
  - ddl615 полный сброс
  applicable_models:
  - Philips EasyKey DDL615-5HBS
  steps: 'Для полного сброса Philips DDL615-5HBS до заводских настроек:

    1. Снимите крышку батарейного отсека на внутреннем блоке замка.

    2. Найдите кнопку [RES] внутри отсека.

    3. Дважды нажмите на кнопку [RES] острым предметом (скрепкой или иголкой).

    4. Дождитесь звукового подтверждения — замок сброшен.

    5. Все пользовательские данные удалены.

    6. Мастер-код вернулся к значению по умолчанию: 12345678.

    '
  warnings:
  - 'После сброса ВСЕ данные будут удалены: отпечатки, PIN-коды, RFID-брелоки, настройки.'
  - Действие необратимо — применяйте только если забыли мастер-код или хотите начать
    настройку с нуля.
  - После сброса ОБЯЗАТЕЛЬНО смените стандартный мастер-код 12345678 (см. manual-033).
  related_problems:
  - ts-001
