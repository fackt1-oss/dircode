  steps: 'Для работы функции обязательно наличие установленной SD-карты!


    **Настройка на мониторе:**

    В настройках можно включить/выключить детектор и задать зону обнаружения. По умолчанию
    выделен весь экран (красные квадраты). Нажатие на квадрат делает его прозрачным
    — в этой зоне движение фиксироваться не будет.


    **Настройка в приложении:**

    Перейдите в Устройства → Дверь → Обнаружение движения. Для получения уведомлений
    на телефон обязательно включите push-уведомления в настройках смартфона.'
