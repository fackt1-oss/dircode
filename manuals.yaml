  steps: 'В приложении можно выбрать, как поведет себя доводчик при отключении основного
    питания 220В (если подключен резервный аккумулятор 24В):


    - **Нет:** Батарея не используется.

    - **Открыто:** Батарея удерживает дверь в открытом положении.

    - **Закрыто:** Батарея удерживает дверь в закрытом положении.

    - **Стандартно:** Батарея обеспечивает работу привода в обычном режиме.'
- id: manual-w1-password-recovery
  category: reset
  title: Восстановление пароля приложения — Dircode W-1
  keywords:
  - забыл пароль
  - восстановить пароль
  - сброс пароля
  - w-1
  - доводчик
  applicable_models:
  - Dircode W-1
  steps: 'Пароль для подключения по Bluetooth по умолчанию: 0000.


    Если вы забыли измененный пароль:

    1. В окне входа в приложение выберите «Забыли пароль».

    2. Введите код верификации (этот код нужно получить у официального дилера или
    продавца Dircode).

    3. Введите новый пароль и подтвердите его.'
- id: manual-s01-adjustment
  category: setup
  title: 3D-регулировка скрытых петель — Dircode S01
  keywords:
  - регулировка
  - настройка
  - петли
  - вертикаль
  - горизонталь
  - прижим
  - s01
  applicable_models:
  - Dircode S01
  steps: '**Регулировка по высоте (±3 мм):**

    1. Шестигранным ключом ослабьте винты А на всех петлях.

    2. Подложите под дверь клин или воздушную подушку для разгрузки петель.

    3. Отрегулируйте вертикальное положение дверного полотна (поднять или опустить)
    с помощью винтов А1.

    4. Выполняйте регулировку поочерёдно на всех петлях.

    5. По завершении затяните винты А.


    **Регулировка по горизонтали (±3 мм):**

    Вращайте винты С шестигранным ключом — поочерёдно на всех петлях.


    **Регулировка по глубине / прижим (±1,5 мм):**

    1. Ослабьте винты В шестигранным ключом на всех петлях.

    2. Установите дверь на нужную глубину.

    3. Затяните винты В на всех петлях поочерёдно (момент затяжки не менее 5 Нм).


    После завершения регулировки установите декоративные накладки.'
- id: manual-s01-installation-rules
  category: installation
  title: Правила подбора и монтажа петель — Dircode S01
  keywords:
  - монтаж
  - установка
  - количество петель
  - доводчик
  - ограничитель
  - s01
  applicable_models:
  - Dircode S01
  steps: 'Максимальная нагрузка 180 кг указана для комплекта из 2 петель на стандартное
    полотно (2100×900 мм).


    **Количество петель:**

    - Ширина полотна более 900 мм: обязательна установка 3-й петли (в верхней трети
    двери, 250 мм от оси верхней петли).

    - Наличие доводчика: обязательно не менее 3 петель независимо от ширины полотна
    (нагрузка от доводчика увеличивается на 20-35%).


    **Крепление коробки:**

    При весе полотна более 60 кг требуется механическое крепление (винты или дюбели)
    на расстоянии не более 100 мм от кромки петель.


    **Ограничитель открывания:**

    Устанавливать на расстоянии не менее 80% ширины полотна от оси петель (в сторону
    замка). Монтаж ограничителя ближе к петлям недопустим (эффект рычага вырвет петли)!'
- id: manual-hyundai-sl616-admin-code
  category: admin_setup
  title: Установка и смена кода администратора — Hyundai HY-SL616
  keywords:
