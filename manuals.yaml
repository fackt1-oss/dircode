  - philips 615 изменить пароль
  - ddl615 стандартный код
  - ddl615 мастер пин код
  - philips easykey мастер пароль
  applicable_models:
  - Philips EasyKey DDL615-5HBS
  steps: 'Вход в мастер-режим (режим настройки) на клавиатуре Philips DDL615-5HBS:

    1. Разбудите клавиатуру — прикоснитесь к ней ладонью или пальцами.

    2. Введите [*] [#].

    3. Введите ваш мастер-код (по умолчанию: 12345678).

    4. Нажмите [#] для подтверждения.

    5. Если замок вошёл в режим настройки, вы услышите голосовое подтверждение.


    Навигация внутри меню:

    - Цифровые клавиши — выбор пунктов меню.

    - Клавиша [*] — возврат на предыдущий уровень.

    - Клавиша [#] — подтверждение выбора.


    Смена мастер-кода:

    Производитель настоятельно рекомендует сразу изменить стандартный код 12345678
    на свой собственный.

    Для смены мастер-кода войдите в мастер-режим и выберите соответствующий пункт
    меню.

    '
  warnings:
  - Заводской мастер-код 12345678 публично известен — ОБЯЗАТЕЛЬНО смените его при
    первой настройке!
  - Мастер-код необходим для всех административных действий на замке.
  - Запомните или надёжно сохраните новый мастер-код. При его утере потребуется полный
    сброс замка (см. manual-036).
  model_key: philips_ddl615
  brand: Philips
  procedure_type: configuration
  updated_at: '2026-05-05'
