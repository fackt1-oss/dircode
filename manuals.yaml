- id: manual-w1-wiring
  category: installation
  title: Подключение клемм и датчиков — Dircode W-1
  keywords:
  - подключение
  - клеммы
  - датчик
  - схема
  - w-1
  - доводчик
  applicable_models:
  - Dircode W-1
  steps: 'На клеммной колодке доступны следующие подключения:


    - **POWER:** Питание 24В (ток >4.5А).

    - **BAT:** Резервный аккумулятор 24В (зарядка до 800 мА).

    - **Датчик открывания (SO):** При отсутствии сигнала — открытие, при наличии —
    остановка.

    - **Датчик закрывания (SC):** При отсутствии сигнала — закрытие, при наличии —
    остановка.

    - **Синхронизация (OUT/COM/IN):** Для двухстворчатых дверей.

    - **Сенсор (SEN):** При наличии сигнала дверь не работает.

    - **Датчик запирания (MJ):** Сигнал подаётся постоянно после закрытия двери.

    - **Вывод состояния:** NO / COM / NC.


    *Внимание: Контакты V+ и V- выдают постоянный ток 24В. Общая мощность вывода не
    более 20 Вт.*'
