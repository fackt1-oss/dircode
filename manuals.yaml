- id: manual-m701-latch-reversal
  category: installation
  title: Смена направления язычка (ригеля) — Dircode M701
  keywords:
  - смена направления
  - перевернуть язычок
  - перевернуть ригель
  - левая правая дверь
  - m701
  applicable_models:
  - Dircode M701
  steps: 'Смена направления ригеля производится перед установкой. Запрещено применять
    силовой способ или разбирать корпус замка!


    **Вариант 1:**

    1. Вставьте тонкий твёрдый предмет (отвёртку, шило) в сервисное отверстие.

    2. Аккуратно надавите, чтобы отщёлкнуть и выдвинуть ригель.

    3. Вытяните ригель руками до конца.

    4. Поверните ригель на 180°.

    5. Вставьте обратно до щелчка.


    **Вариант 2:**

    1. Найдите ползунковый переключатель направления на корпусе.

    2. Переведите его в противоположное положение.

    3. Вытяните ригель руками до конца, поверните на 180° и вставьте обратно до щелчка.

    4. Если переключатель не вернулся в нейтральное положение — верните вручную.'
- id: manual-m701-app-setup
