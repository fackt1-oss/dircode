  steps: 'Войдите в главное меню ([*] → [#] → [Пароль администратора] → [#]) и перейдите
    в раздел [2. Настройка работы].


    - **Автозакрытие:** Можно выбрать 0 (отключено), 10, 15, 20 или 25 секунд. Рекомендуется
    25 секунд.

    - **Мощность мотора:** Доступны Высокая, Средняя и Низкая мощность. Подбирайте
    так, чтобы замок легко открывал и закрывал дверь без лишнего шума и усилий.

    - **Направление открытия:** Если ригеля со стороны сенсорной панели на правой
    стороне двери — установите [Левое]; если на левой — [Правое].'
