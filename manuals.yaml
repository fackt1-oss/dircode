  title: Настройка PIN-кода через приложение Home Access — Philips DDL615-5HBS
  keywords:
  - ddl615 pin код
  - ddl615 добавить пин
  - ddl615 пароль
  - ddl615 добавить код
  - ddl615 настроить пароль
  - ddl615 настроить пин код
  - philips 615 добавить код
  - филипс 615 добавить код
  - филипс 615 пин код
  - ddl615 home access
  - ddl615 приложение
  - philips home access
  - ddl615 bluetooth
  - ddl615 подключить приложение
  - philips 615 код доступа
  - ddl615 настроить код
  - ddl615 пользовательский пин
  - philips easykey приложение
  - ddl615 добавить пользователя пин
  applicable_models:
  - Philips EasyKey DDL615-5HBS
  steps: 'Настройка и изменение PIN-кода в Philips DDL615-5HBS выполняется через мобильное
    приложение:

    1. Скачайте приложение «Home Access» в магазине приложений (App Store / Google
    Play) или отсканируйте QR-код из инструкции.

    2. Зарегистрируйте аккаунт в приложении.

    3. Включите Bluetooth на смартфоне.

    4. Откройте приложение и выберите «Add a device» (Добавить устройство).

    5. Следуйте инструкциям приложения для сопряжения с замком.

    6. Находясь в пределах 1 метра от замка, перейдите в настройки методов разблокировки.

    7. Добавьте или измените PIN-код, следуя подсказкам приложения.

    '
  warnings:
  - Смартфон должен находиться на расстоянии не более 1 метра от замка во время настройки
    (Bluetooth-соединение).
  - Подробное управление пользователями и методами разблокировки в DDL615-5HBS оптимизировано
    для выполнения именно через приложение Home Access.
  - Убедитесь, что на смартфоне включён Bluetooth перед началом сопряжения.
  model_key: philips_ddl615
  brand: Philips
  procedure_type: configuration
  updated_at: '2026-05-05'
- id: manual-035
  category: setup
  title: Режим двойной проверки (Dual verification) — Philips DDL615-5HBS
  keywords:
  - ddl615 двойная верификация
  - ddl615 двухфакторная
  - ddl615 два способа открытия
  - philips 615 двойная проверка
  - ddl615 dual verification
  - ddl615 усиленная защита
  - ddl615 код и отпечаток
  - ddl615 два идентификатора
  - philips easykey двойная проверка
  - ddl615 режим верификации
  - ddl615 general mode
  applicable_models:
  - Philips EasyKey DDL615-5HBS
  steps: 'Philips DDL615-5HBS поддерживает два режима авторизации:


    А) Обычный режим (General mode):

    Дверь открывается любым одним зарегистрированным способом: отпечаток пальца, PIN-код
    или RFID-брелок.


    Б) Режим двойной проверки (Dual verification mode):

    Для открытия требуются любые два разных способа.

    Например: отпечаток пальца + PIN-код, или PIN-код + RFID-брелок.


    Переключение между режимами:

    1. Войдите в мастер-режим на клавиатуре (см. manual-033).

    2. Выберите пункт меню «Режим верификации».

    3. Переключитесь между «Обычным режимом» и «Режимом двойной проверки».

    4. Подтвердите выбор клавишей [#].

    '
  warnings:
  - При включении режима двойной проверки убедитесь, что у всех пользователей зарегистрированы
    минимум два метода доступа — иначе они не смогут открыть дверь.
  - Рекомендуется для помещений с повышенными требованиями к безопасности.
  model_key: philips_ddl615
  brand: Philips
  procedure_type: configuration
  updated_at: '2026-05-05'
