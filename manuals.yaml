  - перевернуть ручку
  - направление ручки
  - smart handle
  - умная ручка
  applicable_models:
  - Sciener Smart Handle
  steps: '**Смена направления ручки:**

    Просто разверните ручку на 180 градусов (и внешнюю, и внутреннюю) перед установкой.


    **Краткий процесс установки:**

    1. Установите замок (врезную часть) в полотно двери.

    2. Соберите внешнюю ручку: закрепите резьбовые штифты и втулки.

    3. Открутите крышку батарейного отсека на внутренней ручке.

    4. Стяжными винтами закрепите обе ручки на двери.

    5. Просуньте провод от внешней ручки и подключите разъем в батарейном отсеке внутренней
    ручки.

    6. Вставьте 4 батарейки ААА и закройте крышку.'
