- id: manual-bio20-add-face
  category: user_management
  title: Добавление лица (Face ID) — Dircode Bio 2.0
  keywords:
  - добавить лицо
  - face id
  - распознавание лица
  - bio 2.0
  applicable_models:
  - Dircode Bio 2.0
  steps: 'Оптимальное расстояние для добавления лица: 0,6 – 0,8 метра от внешней панели.
    На расстоянии более 1,2 м добавление невозможно.


    1. В приложении TTLock выберите добавление лица.

    2. Дождитесь мигания красного индикатора на передней панели.

    3. Расположите лицо прямо напротив камеры.

    4. Запрокиньте голову вверх.

    5. Наклоните голову вниз.

    6. Поверните лицо вправо.

    7. Поверните лицо влево.


    Успешное завершение сопровождается звуковым сигналом.'
