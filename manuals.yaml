- id: manual-032
  category: setup
  title: Активация замка (первичная настройка из демо-режима) — Philips DDL615-5HBS
  keywords:
  - ddl615 активация
  - ddl615 демо режим
  - philips 615 активировать
  - ddl615 код активации
  - philips активация замка
  - ddl615 первая настройка
  - ddl615 первое включение
  - philips easykey активировать
  - ddl615 демонстрационный режим
  - philips 615 код активации
  - ddl615 новый замок
  applicable_models:
  - Philips EasyKey DDL615-5HBS
  steps: 'Если замок новый и находится в демо-режиме, его необходимо активировать
    перед использованием:

    1. Разбудите клавиатуру — прикоснитесь к ней ладонью или пальцами.

    2. Нажмите клавишу [*] дважды.

    3. Введите код активации (этот код должен предоставить продавец или установщик).

    4. Нажмите [#] для подтверждения.

    5. Замок подаст звуковой сигнал, подтверждающий успешную активацию.

    '
  warnings:
  - Код активации — уникальный. Получите его у вашего продавца или дистрибьютора до
    начала установки.
  - Без активации замок работает в демо-режиме и НЕ обеспечивает реальной защиты.
  - После активации обязательно смените стандартный мастер-код 12345678 на свой собственный
    (см. manual-033).
  model_key: philips_ddl615
  brand: Philips
  procedure_type: configuration
  updated_at: '2026-05-05'
