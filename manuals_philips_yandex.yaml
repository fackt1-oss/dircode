- id: manual-philips-alphavp-app-setup
  category: app_setup
  title: Подключение к приложению Philips EasyKey Plus по Wi-Fi — Philips Alpha-VP
  keywords:
  - wi-fi
  - вай фай
  - приложение
  - easykey plus
  - alpha vp
  - alpha-vp
  applicable_models:
  - Philips EasyKey Alpha-VP-5HWS
  steps: 'Замок работает с приложением **Philips EasyKey Plus**.


    **Быстрый способ (по QR-коду):**

    1. Найдите QR-код на крышке батарейного отсека.

    2. В приложении нажмите «Добавить устройство» и отсканируйте QR-код.

    3. Следуйте инструкциям на экране.


    **Ручной способ:**

    1. В приложении нажмите «Добавить устройство» → «Вручную» → выберите модель Alpha-VP-5HWS.

    2. На замке войдите в Главный режим (дважды [*] → [Мастер ПИН] → [#]).

    3. Нажмите [4] (подключение к сети).

    4. Замок скажет: «Подключение, подождите немного».

    5. В приложении введите пароль от вашего Wi-Fi (только 2.4 ГГц) и завершите настройку.'
- id: manual-philips-alphavp-features
  category: operation
  title: Функции безопасности и видеодомофон — Philips Alpha-VP
  keywords:
  - видеодомофон
  - камера
  - экран
  - ночная блокировка
  - ик датчик
  - alpha vp
  - alpha-vp
  applicable_models:
  - Philips EasyKey Alpha-VP-5HWS
  steps: '**Видеодомофон и экран:**

    При нажатии на дверной звонок снаружи, на внутренней панели включается экран,
    а в приложение приходит уведомление. Вы можете поговорить с гостем через смартфон.


    **Разблокировка изнутри (ИК-датчик):**

    Одновременно коснитесь сенсорных зон на передней и задней сторонах внутренней
    ручки. Если функция отключена, её можно включить в меню: Главный режим → [2] →
    [5].


    **Внутренняя блокировка (Ночной режим):**

    При заблокированной двери нажмите и удерживайте кнопку [CLOSE] на внутренней панели.
    Снаружи замок открыть будет нельзя (на экране появится "15937 X"). Разблокировать
    можно только Мастер ПИН-кодом или механическим ключом.


    **Внешняя принудительная блокировка:**

    После закрытия двери долго нажимайте клавишу [8] 2 секунды. Если кто-то откроет
    дверь изнутри — сработает сирена.'
- id: manual-philips-doorbell-app
  category: app_setup
  title: Подключение к приложению и настройка Wi-Fi Chime — Philips Video Doorbell
