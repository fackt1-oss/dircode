    \ добавили главный отпечаток пальца, можно приложить его вместо ввода ПИН-кода).*\
    \ \n\n**Смена Мастер ПИН-кода:**\n1. Войдите в Главный режим.\n2. Нажмите [1]\
    \ → [5].\n3. Введите новый Мастер ПИН-код (6-12 цифр) и нажмите [#].\n4. Повторите\
    \ новый код и нажмите [#]."
