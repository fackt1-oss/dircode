- id: manual-philips-ddl702fvp-app-setup
  category: app_setup
  title: Подключение к приложению Philips Home Access по Wi-Fi — Philips DDL702-FVP
  keywords:
  - wi-fi
  - вай фай
  - приложение
  - home access
  - ddl702 fvp
  - 702 fvp
  applicable_models:
  - Philips EasyKey DDL702-FVP-7HWS
  steps: 'Замок работает с приложением **Philips Home Access**.


    **Быстрый способ (по QR-коду):**

    1. Найдите QR-код под декоративной крышкой внутренней панели.

    2. В приложении нажмите «+» в правом верхнем углу.

    3. Выберите «Сканировать QR-код» и отсканируйте его.

    4. Следуйте инструкциям на экране.


    **Ручной способ:**

    1. В приложении нажмите «+» → «Добавить вручную» → выберите модель DDL702-FVP-7HWS.

    2. На замке войдите в Главный режим (дважды [*] → [Мастер ПИН] → [#]).

    3. Нажмите [4] (подключение к сети).

    4. В приложении введите пароль от вашего Wi-Fi (только 2.4 ГГц) и завершите настройку.'
- id: manual-philips-ddl702fvp-features
  category: operation
  title: Функции безопасности (Режим охраны и Внутренняя блокировка) — Philips DDL702-FVP
  keywords:
  - режим охраны
  - сигнализация
  - armed mode
  - ночная блокировка
  - ddl702 fvp
  - 702 fvp
  applicable_models:
  - Philips EasyKey DDL702-FVP-7HWS
  steps: '**Режим охраны (Armed mode):**

    После закрытия двери (когда загорится белая подсветка клавиши [8]), нажмите клавишу
    [8].

    Если после этого кто-то откроет дверь изнутри — сработает сирена.


    **Внутренняя блокировка (Privacy mode):**

    После запирания двери нажмите и удерживайте кнопку [ЗАКРЫТО] на внутренней панели.
    Внешняя панель заблокируется, при попытке ввода появится подсказка «15937 (X)».


    **Открытие изнутри:**

    Изнутри замок можно открыть двумя способами:

    1. Повернуть механическую поворотную ручку (thumb turn).

    2. Нажать ручку вниз (замок типа Push-Pull).'
