  steps: 'Устройство работает с приложением **Philips Home Access**.


    **Подключение Wi-Fi Chime (внутреннего звонка):**

    1. Включите Philips Wi-Fi Chime в розетку рядом с роутером.

    2. (Опционально) Подключите Chime к роутеру через Ethernet-кабель для более стабильного
    сигнала.

    3. Дождитесь мигания зеленого индикатора на Chime.

    4. В приложении нажмите «Add device» (Добавить устройство).

    5. Отсканируйте QR-код или вручную введите ESN (указан на корпусе устройства).

    6. Следуйте инструкциям в приложении для завершения сопряжения. При успешном сопряжении
    индикатор загорится синим.'
- id: manual-philips-doorbell-install-battery
  category: installation
  title: Установка (питание от аккумулятора) и зарядка — Philips Video Doorbell
  keywords:
  - установка
  - монтаж
  - зарядка
  - аккумулятор
  - снять звонок
  - philips doorbell
  applicable_models:
  - Philips Video Doorbell 7000 series
  steps: '**Установка звонка:**

    1. Выберите место установки (рекомендуемая высота 1.2–1.4 м). Проверьте обзор
    через приложение.

    2. При необходимости используйте монтажный клин 15° для изменения угла обзора.

    3. Закрепите монтажный кронштейн на стене (используйте анкеры для твердых поверхностей).

    4. Совместите нижнюю часть звонка с кронштейном и защелкните верхнюю часть до
    щелчка.


    **Как снять звонок для зарядки:**

    - *Через приложение:* Удерживая звонок рукой, в приложении нажмите «One-Tap Detaching»
    в настройках. Устройство отсоединится автоматически.

    - *Вручную:* Вставьте комплектный штифт в отверстие сверху (Detaching Hole), потяните
    верхнюю часть на себя и поднимите.


    **Зарядка:**

    Заряжайте через порт USB-C. Во время зарядки световое кольцо мигает белым. Когда
    аккумулятор полностью заряжен — горит белым постоянно.'
- id: manual-philips-doorbell-install-wired
  category: installation
  title: Установка (питание от существующей проводки) — Philips Video Doorbell
  keywords:
  - установка
  - монтаж
  - провода
  - питание
  - переменный ток
  - philips doorbell
  applicable_models:
  - Philips Video Doorbell 7000 series
  steps: 'Звонок можно запитать от старой проводки (требуется **8-24V AC**, только
    переменный ток!).


    **ВНИМАНИЕ:** Перед работой обязательно отключите питание на автомате!


    1. В помещении найдите ваш старый механический звонок. Соедините два его провода
    между собой с помощью комплектного кабеля (закоротите звонок).

    2. На улице демонтируйте старую кнопку звонка и вытащите два провода.

    3. Установите монтажный кронштейн Philips на стену.

    4. Подключите два провода к клеммам на задней панели нового дверного звонка (порядок
    проводов не важен, так как это переменный ток).

    5. Прикрепите звонок к кронштейну (снизу вверх до щелчка).

    6. Включите питание на автомате.

    7. Проверьте в приложении: на иконке батареи должно появиться обозначение «AC»
    — это значит, что проводное питание подключено успешно.'
- id: manual-philips-ddl502-master-mode
  category: admin_setup
  title: Вход в режим администратора и смена Мастер ПИН-кода — Philips DDL502
  keywords:
