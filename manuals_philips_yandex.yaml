- id: manual-philips7300-master-pin
  category: admin_setup
  title: Вход в режим администратора и смена Мастер ПИН-кода — Philips 7300
  keywords:
  - мастер пин
  - пароль администратора
  - главный код
  - philips 7300
  - '7300'
  applicable_models:
  - Philips EasyKey 7300
  steps: 'Заводской Мастер ПИН-код по умолчанию: **12345678**.


    **Вход в Главный режим (режим администратора):**

    1. Нажмите [#].

    2. Услышав голосовую подсказку «Введите главный PIN-код», введите Мастер ПИН-код
    и нажмите [#].


    **Смена Мастер ПИН-кода:**

    1. Войдите в Главный режим.

    2. Нажмите [1].

    3. Введите новый Мастер ПИН-код (6-12 цифр) и нажмите [#].

    4. Повторите новый код и нажмите [#].'
- id: manual-philips7300-add-user
  category: user_management
  title: Добавление ПИН-кода, отпечатка или карты — Philips 7300
  keywords:
  - добавить код
  - добавить отпечаток
  - добавить карту
  - philips 7300
  - '7300'
  applicable_models:
  - Philips EasyKey 7300
  steps: 'Войдите в Главный режим, нажав [#] → [Мастер ПИН-код] → [#].

    Затем нажмите [2] (Настройки пользователя) и выберите действие:


    - **Добавить ПИН-код пользователя:** Нажмите [1] → Введите ПИН (6-12 цифр) → [#]
    → Повторите ПИН → [#].

    - **Добавить одноразовый ПИН-код:** Нажмите [2] → Введите ПИН → [#] → Повторите
    ПИН → [#].

    - **Добавить отпечаток пальца:** Нажмите [3] → Прикладывайте палец к датчику несколько
    раз до успешного добавления.

    - **Добавить карту:** Нажмите [4] → Приложите карту к считывателю.'
- id: manual-philips7300-delete-user
  category: user_management
  title: Удаление ПИН-кода, отпечатка или карты — Philips 7300
  keywords:
  - удалить код
  - удалить отпечаток
  - удалить карту
  - очистить память
  - philips 7300
  - '7300'
  applicable_models:
  - Philips EasyKey 7300
  steps: 'Войдите в Главный режим, нажав [#] → [Мастер ПИН-код] → [#].

    Затем нажмите [3] (Удаление пользователя) и выберите действие:


    - **Удалить ПИН-код:** Нажмите [1] → [1] (удалить по номеру 00-09) или [2] (удалить
    все).

    - **Удалить одноразовые ПИН-коды:** Нажмите [2].

    - **Удалить отпечаток:** Нажмите [3] → [1] (удалить по номеру 00-99) или [2] (удалить
    все).

    - **Удалить карту:** Нажмите [4] → [1] (удалить по номеру 00-09) или [2] (удалить
    все).'
- id: manual-philips7300-reset
  category: reset
  title: Сброс до заводских настроек (RESET) — Philips 7300
  keywords:
  - сброс настроек
  - заводские настройки
  - reset
  - ресет
  - philips 7300
  - '7300'
  applicable_models:
  - Philips EasyKey 7300
  steps: '1. Снимите крышку батарейного отсека на внутренней панели.

    2. Найдите отверстие с кнопкой [RES].

    3. Острым предметом (скрепкой) дважды нажмите в отверстие [RES].


    Вся пользовательская информация будет удалена, а Мастер ПИН-код сбросится на 12345678.'
- id: manual-philips7300-system-settings
  category: setup
  title: Системные настройки (Язык, Громкость, Режимы) — Philips 7300
  keywords:
  - язык
  - громкость
  - звук
  - тихий режим
  - двойная проверка
  - philips 7300
  - '7300'
  applicable_models:
  - Philips EasyKey 7300
  steps: 'Войдите в Главный режим, нажав [#] → [Мастер ПИН-код] → [#].

    Затем нажмите [4] (Системные настройки) и выберите:


    - **Язык:** Нажмите [1] → [1] (Китайский) или [2] (Английский).

    - **Громкость:** Нажмите [2] → [1] (Увеличить), [2] (Уменьшить) или [3] (Отключить
    звук / Тихий режим).

    - **Режим двойной проверки:** Нажмите [3] → [1] (Обычный режим) или [2] (Режим
    двойной проверки - для открытия нужны 2 разных способа).'
- id: manual-philips7300-features
  category: operation
  title: Функции безопасности (Блокировка изнутри, Безопасная ручка) — Philips 7300
  keywords:
  - ночная блокировка
  - закрыться изнутри
  - безопасная ручка
  - защита от детей
  - philips 7300
  - '7300'
  applicable_models:
  - Philips EasyKey 7300
  steps: '**Внутренняя блокировка (Ночной режим):**

    Нажмите и удерживайте кнопку [ЗАКРЫТЬ] на внутренней панели, пока индикатор не
    мигнёт красным. Снаружи замок открыть будет нельзя (кроме Мастер ПИН-кода или
    механического ключа).


    **Безопасная ручка (Safe Handle):**

    Блокирует открытие двери изнутри нажатием на ручку (защита от детей и животных).

    - Включить: Поверните переключатель на ручке в красную сторону.

    - Выключить: Поверните переключатель в зелёную сторону.'
