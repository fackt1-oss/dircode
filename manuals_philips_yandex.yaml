  steps: "**Режим охраны (Armed mode):**\nПосле закрытия двери (когда загорится белая\
    \ подсветка клавиши [8]), нажмите клавишу [8].\nЕсли после этого кто-то откроет\
    \ дверь изнутри — сработает сирена. \n*(Функция доступна только если врезная часть\
    \ замка оснащена датчиком обнаружения)*.\n\n**Открытие изнутри:**\nИзнутри замок\
    \ можно открыть двумя способами:\n1. Повернуть механическую поворотную ручку (thumb\
    \ turn).\n2. Дважды нажать кнопку [OPEN/CLOSE] в течение 1 секунды, затем нажать\
    \ ручку."
- id: manual-philips-ddl902-activation
  category: setup
  title: Активация замка (выход из демо-режима) — Philips DDL902
  keywords:
  - демо режим
  - активация
  - первый запуск
  - ddl902
  - '902'
  applicable_models:
  - Philips Home Access DDL902-MFVP-11HWS
  steps: 'По умолчанию замок находится в демо-режиме (открывается любым отпечатком,
    лицом, веной или ПИН-кодом).


    **Способ 1 (Основной - через приложение):**

    1. Установите батарею в замок.

    2. Скачайте приложение **Philips Home Access**.

    3. Добавьте замок в приложение и подключите его к Wi-Fi. После успешного подключения
    замок активируется автоматически.


    **Способ 2 (Без интернета - ручная активация):**

    1. Коротко нажмите кнопку [SET] на внутренней панели острым предметом.

    2. Следуйте голосовым подсказкам для последовательной регистрации мастер ПИН-кода,
    мастер-отпечатка пальца и мастер-вены ладони.

    *(Кнопка SET регистрирует только один мастер-метод за одно нажатие).*'
