  title: Сброс до заводских настроек (RESET) — Philips DDL615
  keywords:
  - сброс настроек
  - заводские настройки
  - reset
  - ресет
  - ddl615
  - '615'
  applicable_models:
  - Philips EasyKey DDL615-5HBS
  steps: '1. Найдите кнопку [RES] на внутренней панели (под крышкой батарейного отсека).

    2. Острым предметом дважды нажмите кнопку [RES].


    Вся пользовательская информация будет удалена, а замок вернется к заводским настройкам.'
- id: manual-philips-ddl615-features
  category: operation
  title: Запирание двери и внутренняя блокировка — Philips DDL615
  keywords:
  - запирание
  - ночная блокировка
  - защита от детей
  - ddl615
  - '615'
  applicable_models:
  - Philips EasyKey DDL615-5HBS
  steps: '**Запирание двери:**

    Для запирания двери снаружи или изнутри необходимо закрыть дверь и **поднять ручку
    вверх**.


    **Блокировка открытия изнутри (Защита от взлома через глазок):**

    Эта функция включается и отключается **через приложение Philips Home Access**.
    Когда она включена, нажатие внутренней ручки не откроет дверь.

    *Отключить эту блокировку можно также открыв дверь снаружи любым Мастер-методом
    (Мастер ПИН-код, Мастер-отпечаток).*'
- id: manual-philips-ddl702-master-mode
  category: admin_setup
  title: Вход в режим администратора и смена Мастер ПИН-кода — Philips DDL702
  keywords:
  - мастер пин
  - пароль администратора
  - главный код
  - ddl702
  - '702'
  applicable_models:
  - Philips EasyKey DDL702
  steps: 'Заводской Мастер ПИН-код по умолчанию: **12345678**.


    **Вход в Главный режим:**

    1. Коснитесь клавиатуры для пробуждения.

    2. Нажмите [#] (перед вводом любых цифр).

    3. Введите Мастер ПИН-код и нажмите [#].


    **Смена Мастер ПИН-кода:**

    1. Войдите в Главный режим.

    2. Нажмите [1].

    3. Введите новый Мастер ПИН-код (6-12 цифр) и нажмите [#].

    4. Повторите новый код и нажмите [#].'
- id: manual-philips-ddl702-add-user
  category: user_management
  title: Добавление лица (Face ID), ПИН-кода или отпечатка — Philips DDL702
  keywords:
  - добавить лицо
  - face id
  - добавить код
  - добавить отпечаток
  - ddl702
  - '702'
  applicable_models:
  - Philips EasyKey DDL702
  steps: 'Войдите в Главный режим (нажмите [#] → [Мастер ПИН] → [#]).

    Затем нажмите [2] (Настройки пользователя) и выберите действие:


    - **Добавить ПИН-код:** Нажмите [1] → Введите ПИН (6-12 цифр) → [#] → Повторите
    ПИН → [#].

    - **Добавить отпечаток:** Нажмите [3] → Прикладывайте палец к датчику (находится
    на задней части ручки) несколько раз до успешного добавления.

    - **Добавить лицо (Face ID):** Нажмите [4] → Расположите лицо перед камерой и
    осторожно поворачивайте голову под разными углами, следуя голосовым подсказкам.'
- id: manual-philips-ddl702-delete-user
  category: user_management
  title: Удаление пользователей (включая лица) — Philips DDL702
  keywords:
  - удалить лицо
  - удалить код
  - удалить отпечаток
  - очистить память
  - ddl702
  - '702'
  applicable_models:
  - Philips EasyKey DDL702
  steps: 'Войдите в Главный режим (нажмите [#] → [Мастер ПИН] → [#]).

    Затем нажмите [3] (Удаление пользователя) и выберите действие:


    - **Удалить ПИН-код:** Нажмите [1] → [1] (удалить по номеру 00-09) или [2] (удалить
    все).

    - **Удалить отпечаток:** Нажмите [3] → [1] (удалить по номеру 00-99) или [2] (удалить
    все).

    - **Удалить лицо:** Нажмите [5] → [1] (удалить конкретное лицо — нужно расположить
    лицо перед камерой) или [2] (удалить все лица).'
- id: manual-philips-ddl702-reset
  category: reset
  title: Сброс до заводских настроек (RESET) — Philips DDL702
  keywords:
  - сброс настроек
  - заводские настройки
  - reset
  - ресет
  - ddl702
  - '702'
  applicable_models:
  - Philips EasyKey DDL702
  steps: '1. Снимите крышку батарейного отсека на внутренней панели.

    2. Острым предметом (скрепкой) дважды нажмите кнопку [RES].

    3. Вы услышите голосовую подсказку «Восстановление настроек по умолчанию».


    Вся пользовательская информация (включая лица) будет удалена, а Мастер ПИН-код
    сбросится на 12345678.'
- id: manual-philips-ddl702-features
  category: operation
  title: Функции безопасности (Внутренний засов, ИК-сенсор) — Philips DDL702
  keywords:
  - ночная блокировка
  - закрыться изнутри
  - открыть изнутри
  - сенсорная ручка
  - ddl702
  - '702'
  applicable_models:
  - Philips EasyKey DDL702
  steps: '**Открытие изнутри (ИК-сенсор):**

    Чтобы открыть дверь изнутри, просто одновременно коснитесь сенсорных зон с обеих
    сторон внутренней ручки. Если датчик отключен, его можно включить, удерживая кнопку
    [ОТКРЫТО/ЗАКРЫТО] до появления зелёного мерцания.


    **Внутренний засов (Ночной режим):**

    После блокировки двери нажмите и удерживайте кнопку [ЗАКРЫТО] на внутренней панели,
    пока индикатор не мигнёт красным. Снаружи замок открыть будет нельзя (на экране
    появится "15937 X"). Разблокировать можно только Мастер ПИН-кодом или механическим
    ключом.


    **Внешняя принудительная блокировка:**

    После запирания двери нажмите и удерживайте кнопку принудительного закрытия на
    внешней панели 2 секунды. Если кто-то откроет дверь изнутри — сработает сирена.'
- id: manual-philips-ddl702-face-scanner
  category: operation
  title: Включение/отключение сканера лица — Philips DDL702
  keywords:
  - сканер лица
  - отключить камеру
  - face id
  - ddl702
  - '702'
  applicable_models:
  - Philips EasyKey DDL702
  steps: 'Вы можете быстро включить или отключить функцию распознавания лиц с помощью
    специальных команд на клавиатуре (после её пробуждения):


    - Ввести **405#** — Включить сканер лица.

    - Ввести **406#** — Отключить сканер лица.


    *Примечание: При низком заряде батарей замок автоматически отключает функцию распознавания
    лиц для экономии энергии.*'
