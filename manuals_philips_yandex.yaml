- id: manual-philips-ddl902-battery-charging
  category: operation
  title: Зарядка аккумулятора (проводная и беспроводная) — Philips DDL902
  keywords:
  - зарядить аккумулятор
  - беспроводная зарядка
  - села батарея
  - ddl902
  - '902'
  applicable_models:
  - Philips Home Access DDL902-MFVP-11HWS
  steps: 'В замке используется литий-полимерный аккумулятор на 5000 мАч.


    **Способ 1 (Проводная зарядка):**

    1. Извлеките аккумулятор из замка.

    2. Зарядите его через USB-кабель (5V).


    **Способ 2 (Беспроводная магнитная зарядка):**

    Уникальная функция этой модели — возможность заряжать аккумулятор, не вынимая
    его из двери!

    1. Возьмите магнитное беспроводное зарядное устройство (стандарт Qi, 5V/2A).

    2. Примагнитьте его к зоне беспроводной зарядки на внутренней панели замка.

    *(Поддерживаются зарядные устройства брендов: Philips, Baseus, Anker, Xiaomi,
    Mophie, Apple).*'
- id: manual-philips-ddl902-features
  category: operation
  title: Функции безопасности и видео (Камеры, ИК-ручка, Голосовые сообщения) — Philips
    DDL902
  keywords:
  - камера
  - видеодомофон
  - сообщение
  - открыть изнутри
  - ddl902
  - '902'
  applicable_models:
  - Philips Home Access DDL902-MFVP-11HWS
  steps: '**Три камеры:**

    Замок оснащен основной камерой, передней суб-камерой (для обзора посылок внизу,
    без слепых зон) и задней камерой (смотрит внутрь помещения). Переключаться между
    ними можно в приложении.


    **Голосовое сообщение посетителя:**

    Если посетитель нажимает звонок 3 раза в течение 15 секунд, а вы не отвечаете,
    замок предложит ему оставить голосовое сообщение. Вы услышите его при следующем
    открытии двери.


    **Открытие изнутри (ИК-сенсор):**

    Внутренняя ручка оснащена инфракрасным датчиком. Просто возьмитесь за сенсорную
    зону ручки, и дверь откроется (функцию можно включить/отключить в приложении).


    **Внутренняя блокировка (Ночной режим):**

    После закрытия двери долго нажмите кнопку [CLOSE] на внутренней панели. Внешняя
    панель заблокируется, на экране появится значок замка.'
- id: manual-philips-gateway-setup
  category: app_setup
  title: Подключение Wi-Fi шлюза к приложению — Philips EasyKey Gateway
  keywords:
  - шлюз
  - gateway
  - wi-fi шлюз
  - удаленное управление
  - интернет
  - philips gateway
  applicable_models:
  - Philips EasyKey Gateway
  steps: 'Шлюз необходим для удаленного управления Bluetooth-замками Philips (создание
    временных паролей, просмотр истории открытий из любой точки мира).


    **Шаг 1. Добавление шлюза в приложение:**

    1. Включите шлюз в розетку.

    2. Откройте приложение Philips EasyKey.

    3. Нажмите «Добавить устройство» (или +) и выберите тип «Gateway» (Шлюз).

    4. Следуйте инструкциям для подключения шлюза к вашей Wi-Fi сети (только 2.4 ГГц).


    **Шаг 2. Привязка шлюза к замку:**

    1. В приложении перейдите в «Настройки» → «Шлюз в паре».

    2. Выберите добавленный шлюз и привяжите его к вашему замку.


    *Индикация шлюза:*

    - Горит синим: Сеть подключена, всё работает.

    - Мигает синим и красным: Режим сопряжения/настройки.

    - Мигает красным: Обновление прошивки (НЕ ОТКЛЮЧАЙТЕ ПИТАНИЕ!).'
