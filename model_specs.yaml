    USB Type-C (Power Bank) или механический ключ.
    Удалённое управление через приложение TTLock — по Wi-Fi хабу (приобретается отдельно).
    Врезная часть: ставится в любую существующую врезную с межосевым 72, 85 или 92 мм.
    Узкопрофильный замок — типовой бэксет врезной части 28, 30 или 35 мм. Если ригели
    не убираются с квадрата, замок будет работать только на язычке.

